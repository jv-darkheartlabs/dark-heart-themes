name: validate-themes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate Cursor themes from Zed sources
        run: python3 editors/cursor/scripts/zed_to_cursor.py
      - name: Validate converted themes
        run: python3 editors/cursor/scripts/validate_themes.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build gallery catalog and verify source fidelity
        run: |
          node scripts/build-gallery.mjs
          node --test scripts/gallery.test.mjs
